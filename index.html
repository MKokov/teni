<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1830">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тени">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Тени — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app column; on wide screens it sits centered as a device. Single deliberate night look. */
:root{
  --void:#120F22;
  --night:#1B1830;
  --panel:#27223F;
  --panel-2:#332C52;
  --line:#41396A;
  --ink:#F4EEFF;
  --muted:#BDB4DB;
  --lamp:#FFC65C;
  --lamp-soft:#FFE0A3;
  --lamp-ink:#2A1F0E;
  --peach:#FFB38A;
  --mint:#8EE3C1;
  --lilac:#B9A4FF;
  --danger:#F07A8E;
  --warn:#FFA877;
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--void)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}

.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--night);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px){
  body{display:flex;align-items:center;justify-content:center;padding-block:16px}
  .app{width:400px;height:min(100%,860px);border-radius:36px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
}
#view{display:flex;flex-direction:column;height:100%;min-height:0}

/* Header */
.top{padding:18px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.top h1{font-size:26px;color:#fff;line-height:1.15}
.top-right{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-weight:800;font-size:15px;color:var(--lamp-soft);font-variant-numeric:tabular-nums}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.lvl{padding:0 16px 10px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--muted)}
.lvl .bar{flex:1}
.bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--lamp);transition:width .5s ease}

/* Screen */
.screen{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.screen>*{flex-shrink:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-head h2{font-size:18px;color:#fff}
.label{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--lamp)}
.muted{color:var(--muted);font-size:14px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-title h2{font-size:20px;color:#fff}

/* Weather */
.weather{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wbtn{border:2px solid transparent;background:var(--panel-2);border-radius:16px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:800;color:var(--muted);padding:6px 2px}
.wbtn[aria-pressed="true"]{border-color:var(--lamp);background:#463D72;color:var(--lamp-soft)}
.mood{font-size:14px;font-weight:700;color:var(--ink);background:var(--panel-2);border-radius:14px;padding:10px 12px}

/* Garden */
.garden{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
.garden svg{display:block;width:100%;height:auto}
.gchip{position:absolute;background:rgba(27,24,48,.88);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800;color:var(--ink)}
.gchip.tl{left:12px;top:12px}
.gchip.br{right:12px;bottom:12px}

/* Rows */
.row{display:flex;align-items:center;gap:12px}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.row .name{font-weight:800;font-size:16px}
.mini{width:58px;height:62px;flex-shrink:0}
.strength{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.strength .bar{flex:1;height:8px}

.btn{min-height:44px;padding:0 16px;border-radius:14px;border:none;background:var(--lamp);color:var(--lamp-ink);font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.big{min-height:54px;font-family:var(--display);font-weight:600;font-size:18px;border-radius:18px;width:100%}
.btn[disabled]{opacity:.5;cursor:default}

.task-card{background:var(--lamp);color:var(--lamp-ink);border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px}
.task-card .label{color:#6B4508}
.task-card .t{font-weight:800;font-size:16px;line-height:1.3}
.task-card .btn{background:var(--lamp-ink);color:var(--lamp-soft)}
.badge{width:46px;height:46px;border-radius:16px;background:var(--lamp-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Tasks list */
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:12px 14px;width:100%;text-align:left}
.task .check{width:40px;height:40px;border-radius:999px;border:2px solid var(--lamp);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.task.done .check{background:var(--lamp)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tt{font-weight:800;font-size:15px}
.task .rw{font-size:12px;font-weight:700;color:var(--muted)}

/* Shadows grid */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.scard svg{width:96px;height:104px}
.scard .name{font-weight:800;font-size:15px;line-height:1.25}
.scard .strength{width:100%}
.scard .btn{width:100%}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#264A40;color:var(--mint)}
.add{border:2px dashed var(--line);background:transparent;border-radius:22px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:800}

/* Journal */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field input{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--panel-2);padding:0 14px;font-size:16px;font-weight:700}
.field input::placeholder{color:#8C83AE}
.err{color:var(--danger);font-size:14px;font-weight:700;min-height:1px}
.entry{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:none;padding-top:0}
.entry ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-weight:700}
.lit{display:flex;align-items:center;gap:10px;font-weight:800}
.dot{width:12px;height:12px;border-radius:999px;background:var(--lamp);box-shadow:0 0 12px var(--lamp);flex-shrink:0}

/* Nav */
.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px 12px 10px;background:#221E3B;border-top:1px solid var(--line)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;font-size:12px;font-weight:800;color:var(--muted);border-radius:14px}
.nav button[aria-current="page"]{color:var(--lamp)}

/* Overlays */
.overlay{position:absolute;inset:0;z-index:20;background:#16132A;display:flex;flex-direction:column;overflow-y:auto}
.enc-top{padding:16px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.enc-top p{font-family:var(--display);font-weight:600;font-size:19px}
.pill{background:var(--panel);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.enc-scene{position:relative}
.enc-scene svg{display:block;width:100%;height:auto}
.bubble{position:absolute;left:16px;top:12px;max-width:62%;background:var(--ink);color:#2A2440;border-radius:20px 20px 20px 6px;padding:11px 14px;font-weight:800;font-size:15px;line-height:1.35;animation:pop .35s ease}
.enc-meter{padding:0 18px;display:flex;flex-direction:column;gap:6px}
.enc-meter .bar{height:12px}
.enc-card{margin:14px 16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px}
.enc-card h2{font-size:19px;color:#fff}
.opt{text-align:left;min-height:50px;padding:12px 14px;border-radius:16px;border:2px solid transparent;background:var(--panel-2);font-weight:700;font-size:15px;line-height:1.35}
.opt:hover{border-color:var(--lamp)}
.own{display:flex;gap:8px}
.own input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--night);padding:0 12px;font-size:15px;font-weight:700}
.own input::placeholder{color:#8C83AE}
.delta{display:flex;flex-wrap:wrap;gap:8px}
.delta span{font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--panel-2)}
.hint{font-size:14px;font-weight:700;color:var(--lamp-soft);background:#3C3354;border-radius:14px;padding:10px 12px}

.sheet-wrap{position:absolute;inset:0;z-index:30;background:rgba(10,8,20,.6);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--panel);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
.sheet h2{font-size:21px;color:#fff}
.looks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.look{border:2px solid transparent;background:var(--panel-2);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;color:var(--muted)}
.look svg{width:56px;height:60px}
.look[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp-soft)}

.tame{position:absolute;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,#3A3170 0%,#16132A 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px;text-align:center}
.stage{position:relative;width:220px;height:230px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.t-shadow{animation:vanish 1.4s ease forwards;transform-origin:50% 60%}
.t-pet{opacity:0;animation:pop .7s 1.15s ease forwards;transform-origin:50% 70%}
.t-spark{opacity:0;animation:twinkle 1.6s 1.2s ease infinite}
.tame h2{font-size:30px;color:var(--lamp)}
.tame p{max-width:300px;font-weight:700;color:var(--ink)}
.tame .reward{color:var(--lamp-soft);font-weight:800}

.intro{position:absolute;inset:0;z-index:45;background:radial-gradient(circle at 50% 30%,#3A3170 0%,#16132A 72%);display:flex;flex-direction:column;align-items:center;gap:14px;padding:64px 20px 24px;text-align:center;overflow-y:auto}
.intro .skip{position:absolute;right:12px;top:12px;min-height:44px;padding:0 14px;border:none;background:none;color:var(--muted);font-weight:800;font-size:14px}
.intro-art{width:100%;max-width:320px;height:210px;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0}
.intro-art svg{height:100%;max-width:100%}
.intro-art .garden-mini{border-radius:22px;overflow:hidden;border:1px solid var(--line);height:100%;aspect-ratio:360/300;max-width:100%}
.intro-art .garden-mini svg{display:block;width:100%;height:100%}
.intro h2{font-size:26px;color:var(--lamp)}
.intro p{max-width:330px;font-weight:700;line-height:1.5}
.intro .note{font-size:13px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:8px}
.dots span{width:8px;height:8px;border-radius:999px;background:var(--line)}
.dots span.on{background:var(--lamp);width:22px}
.intro-nav{margin-top:auto;display:flex;gap:10px;width:100%;max-width:330px}
.intro-nav .btn{flex:1;min-height:52px;font-size:16px}
.daybar{display:flex;gap:6px;padding:0 16px 10px}
.daybar span{flex:1;text-align:center;font-size:11px;font-weight:800;padding:5px 2px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.daybar span.ok{background:#264A40;color:var(--mint);border-color:#2F6152}
.wcompact .wicon{width:44px;height:44px;border-radius:14px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--lamp-soft);flex-shrink:0}
.wcompact .muted{font-size:13px}
.card.glow{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp),0 10px 30px rgba(255,198,92,.15)}
.linkbtn{background:none;border:none;color:var(--muted);font-weight:800;font-size:13px;min-height:36px;text-decoration:underline;text-underline-offset:3px}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;min-height:56px}
.preset svg{width:40px;height:44px;flex-shrink:0}
.preset span{display:flex;flex-direction:column}
.preset small{color:var(--muted);font-weight:700;font-size:12px}
.preset[disabled]{opacity:.45;cursor:default}
.sheet{max-height:88%;overflow-y:auto}
.group{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
form.group{border-top:none;padding-top:0}
.code{width:100%;min-height:70px;border-radius:14px;border:1px solid var(--line);background:var(--night);color:var(--ink);padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;word-break:break-all;resize:vertical}
.btn.ghost[disabled]{opacity:.55}
.orbfly{position:absolute;z-index:60;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#FFF3C4 0,#FFC65C 55%,rgba(255,198,92,0) 72%);pointer-events:none}
.toast{position:absolute;left:50%;top:14px;z-index:50;transform:translate(-50%,-220%);background:var(--lamp);color:var(--lamp-ink);font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .3s ease;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}

.bob{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bob.d2{animation-delay:-1.1s}.bob.d3{animation-delay:-2.2s}
.lurk{animation:lurk 4s ease-in-out infinite;transform-box:fill-box}
.hit{animation:hit .55s ease;transform-box:fill-box;transform-origin:center}
.flicker{animation:flicker 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

.twinkle{animation:twinkle 3.2s ease-in-out infinite}
.pulse{animation:pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drift{animation:drift 24s ease-in-out infinite alternate}
.drift.slow{animation-duration:36s;animation-delay:-9s}
.sway{animation:sway 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.flower{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.breathe{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fog{animation:fog 13s ease-in-out infinite alternate}
.drop{animation:drop .9s linear infinite}
.flash{opacity:0;animation:flash 7s linear infinite}
.fly{animation:fly 6s ease-in-out infinite}
.butterfly{animation:flutter 18s linear infinite}
.wing{animation:flap .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bob{0%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}60%{transform:translateY(0)}72%{transform:translateY(-13px)}80%{transform:translateY(0)}86%{transform:translateY(-3px)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(24px)}}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@keyframes breathe{50%{transform:scale(1.015,1.035)}}
@keyframes fog{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
@keyframes drop{0%{transform:translate(0,-26px);opacity:0}15%{opacity:1}100%{transform:translate(-9px,48px);opacity:0}}
@keyframes flash{0%,86%,90%,94%,100%{opacity:0}87%,92%{opacity:1}}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.15}25%{transform:translate(9px,-11px);opacity:1}50%{transform:translate(-4px,-20px);opacity:.45}75%{transform:translate(-11px,-7px);opacity:1}}
@keyframes flutter{0%{transform:translate(-30px,150px)}20%{transform:translate(70px,110px)}40%{transform:translate(150px,150px)}60%{transform:translate(230px,105px)}80%{transform:translate(310px,140px)}100%{transform:translate(400px,110px)}}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes lurk{50%{transform:translateX(4px);opacity:.7}}
@keyframes hit{20%{transform:translateX(-8px) rotate(-3deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes flicker{50%{opacity:.75;transform:scale(1.06)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes vanish{0%{transform:scale(1)}30%{transform:scale(1.08) rotate(-4deg)}100%{transform:scale(.05) rotate(20deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .t-shadow{opacity:0}.t-pet,.t-spark{opacity:1}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gFired" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A7499"/><stop offset="1" stop-color="#3B3757"/></linearGradient>
    <linearGradient id="gMoney" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F7FA0"/><stop offset="1" stop-color="#363F5C"/></linearGradient>
    <linearGradient id="gHost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#957BD0"/><stop offset="1" stop-color="#4A3B80"/></linearGradient>
    <linearGradient id="pPeach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD0B0"/><stop offset="1" stop-color="#FF9F6B"/></linearGradient>
    <linearGradient id="pMint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C2F5E0"/><stop offset="1" stop-color="#6FCFA8"/></linearGradient>
    <linearGradient id="pLilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCD0FF"/><stop offset="1" stop-color="#9A82F0"/></linearGradient>
    <linearGradient id="gCloak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B8BD6"/><stop offset="1" stop-color="#3A5F9E"/></linearGradient>

function sfx(type){
  if(!state.sound)return;

    const notes={light:[880,1320],level:[660,880,1100,1320],tame:[523,659,784,1046,1318],tap:[520]}[type];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t0=actx.currentTime+i*.09;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(type==='tap'?.05:.1,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+.35);
      o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+.4)});
  }catch(e){}
}

// place art (box 140x150 for creatures, 160x192 for hero) by bottom-centre
const place=(inner,cx,bottom,s,cls='',w=140,h=150)=>`<g transform="translate(${(cx-w/2*s).toFixed(1)} ${(bottom-h*s).toFixed(1)}) scale(${s.toFixed(3)})"><g class="${cls}">${inner}</g></g>`;
const mini=(sh,tamed)=>`<svg viewBox="-5 -14 150 164" aria-hidden="true">${tamed?petArt(sh):shadowArt(sh)}</svg>`;

function gardenSVG(){
  const w=state.weather||'fog', eve=state.evening, lv=level(state.light);
  const sky=eve?'skyEve':{storm:'skyStorm',rain:'skyRain',fog:'skyFog',partly:'skyPartly',sun:'skySun'}[w];
  let s=`<rect width="360" height="300" fill="url(#${sky})"/>`;
  if(eve) s+='<circle cx="292" cy="176" r="60" fill="#FFE7B0" opacity=".25" class="pulse"/><circle cx="292" cy="176" r="28" fill="#FFE7B0"/>';
  else if(w==='sun'||w==='partly') s+='<circle cx="290" cy="60" r="42" fill="#FFF3C4" opacity=".35" class="pulse"/><circle cx="290" cy="60" r="22" fill="#FFE59A"/>';
  else s+='<circle cx="290" cy="56" r="30" fill="#F4E8C8" opacity=".18" class="pulse"/><circle cx="290" cy="56" r="20" fill="#F4E8C8" opacity=".85"/><circle cx="298" cy="50" r="18" fill="#5A4F88" opacity=".9"/>';
  if(!eve&&(w==='fog'||w==='storm')) [[40,40,1.6],[120,24,1.2],[210,44,1.8],[160,70,1.2],[80,86,1.1],[250,22,1.4],[24,110,1.2]].forEach(([x,y,r],i)=>{s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFE7B0" class="twinkle" style="animation-delay:-${(i*.7).toFixed(1)}s"/>`});
  if(!eve&&(w==='partly'||w==='rain'||w==='storm')){
    const c=w==='partly'?'#F4F6FF':w==='rain'?'#8D96B8':'#4C4670';
    s+=`<g fill="${c}" opacity=".95"><g class="drift"><ellipse cx="90" cy="62" rx="44" ry="16"/><ellipse cx="116" cy="50" rx="28" ry="18"/></g><g class="drift slow"><ellipse cx="226" cy="84" rx="40" ry="14"/><ellipse cx="248" cy="74" rx="24" ry="15"/></g></g>`;
  }
  s+='<ellipse cx="180" cy="272" rx="190" ry="44" fill="#2A2450"/><path d="M18 236 Q180 176 342 236 L324 264 Q180 302 36 264 Z" fill="url(#gLand)"/><path d="M36 264 Q180 302 324 264 L304 282 Q180 312 56 282 Z" fill="#6A5A48"/>';
  if(lv>=2){
    s+='<rect x="64" y="148" width="11" height="78" rx="4" fill="#7A5A3A"/><g class="sway"><circle cx="69" cy="138" r="36" fill="#4E8A64"/><circle cx="48" cy="156" r="24" fill="#5E9B72"/><circle cx="90" cy="154" r="26" fill="#5E9B72"/>';
    if(lv>=3) s+='<circle cx="56" cy="128" r="6" fill="#FFB38A"/><circle cx="84" cy="134" r="6" fill="#FFE0A3"/><circle cx="70" cy="156" r="6" fill="#B9A4FF"/><circle cx="96" cy="150" r="5" fill="#FFB38A"/><circle cx="42" cy="148" r="5" fill="#8EE3C1"/>';
    s+='</g>';
  }
  if(lv>=4) s+='<ellipse cx="318" cy="232" rx="22" ry="14" fill="#5E9B72"/><circle cx="310" cy="226" r="4" fill="#FFB38A"/><circle cx="324" cy="230" r="4" fill="#B9A4FF"/>';
  const spots=[[40,248],[118,228],[150,232],[222,226],[262,228],[292,240],[132,250],[60,238],[244,246],[312,250],[96,250],[200,250]];
  const cols=['#FFB38A','#B9A4FF','#FFE0A3','#8EE3C1'];
  const nf=Math.min(spots.length,Math.floor(state.light/3));
  for(let i=0;i<nf;i++){const[x,y]=spots[i];s+=`<g class="flower" style="animation-delay:-${(i*.41).toFixed(2)}s;animation-duration:${(2.8+(i%4)*.35).toFixed(2)}s"><rect x="${x-1.5}" y="${y}" width="3" height="14" fill="#3E7A52"/><circle cx="${x}" cy="${y-2}" r="5.5" fill="${cols[i%4]}"/><circle cx="${x}" cy="${y-2}" r="2" fill="#fff" opacity=".6"/></g>`}
  const ls=[[108,240],[254,236],[300,242],[30,242],[204,238]];
  for(let i=0;i<Math.min(ls.length,state.lanterns);i++){const[x,y]=ls[i];
    s+=`<circle cx="${x}" cy="${y-30}" r="${eve?18:11}" fill="url(#gLamp)" class="flicker"/><rect x="${x-1.5}" y="${y-28}" width="3" height="30" fill="#5A4A3A"/><rect x="${x-6}" y="${y-38}" width="12" height="13" rx="3" fill="#FFC65C" stroke="#C98A2B" stroke-width="1.5"/>`}
  const pets=state.shadows.filter(x=>x.tamed), pp=[[234,256],[134,258],[284,262],[88,262],[318,264]];
  pets.slice(0,pp.length).forEach((p,i)=>{s+=place(petArt(p),pp[i][0],pp[i][1],.27,'bob d'+((i%3)+1))});
  const lurk=state.shadows.filter(x=>!x.tamed), lp=[[334,214],[22,212],[318,150],[40,150]];
  lurk.slice(0,lp.length).forEach((p,i)=>{const sc=.17+p.strength*.0016;s+=`<g opacity="${(.45+p.strength*.004).toFixed(2)}">${place(shadowArt(p),lp[i][0],lp[i][1],sc,'lurk')}</g>`});
  s+=place(heroArt(eve?1.4:1),180,258,.42,'breathe',160,192);
  const nfly=eve?8:{fog:6,storm:2,rain:2,partly:3,sun:3}[w];
  [[60,196],[122,160],[252,182],[302,204],[204,140],[92,124],[160,206],[322,150]].slice(0,nfly).forEach(([x,y],i)=>{
    s+=`<g class="fly" style="animation-delay:-${(i*.83).toFixed(2)}s;animation-duration:${5+(i%3)}s"><circle cx="${x}" cy="${y}" r="5" fill="#FFF3A8" opacity=".3"/><circle cx="${x}" cy="${y}" r="1.8" fill="#FFF7C8"/></g>`});
  if(!eve&&(w==='sun'||w==='partly')) s+='<g class="butterfly"><g class="wing"><ellipse cx="-4" cy="0" rx="4.5" ry="5.5" fill="#FFB3C7"/><ellipse cx="4" cy="0" rx="4.5" ry="5.5" fill="#B9A4FF"/></g><rect x="-.8" y="-4" width="1.6" height="8" rx=".8" fill="#3A2A4A"/></g>';
  if(!eve){
    const fo={storm:.12,rain:.1,fog:.14,partly:.05,sun:0}[w];
    if(fo) s+=`<g fill="#fff" opacity="${fo}"><rect x="-10" y="150" width="380" height="16" rx="8" class="fog"/><rect x="40" y="182" width="320" height="12" rx="6" class="fog" style="animation-delay:-5s;animation-duration:17s"/><rect x="-20" y="208" width="260" height="14" rx="7" class="fog" style="animation-delay:-9s;animation-duration:11s"/></g>`;
    if(w==='rain'||w==='storm'){s+='<g stroke="#BFD4FF" stroke-width="2" stroke-linecap="round" opacity=".55">';for(let i=0;i<22;i++){const x=(i*41)%360+8,y=(i*67)%200+20;s+=`<path d="M${x} ${y} l-4 10" class="drop" style="animation-delay:-${((i*.37)%1).toFixed(2)}s"/>`}s+='</g>'}
    if(w==='storm') s+='<g opacity=".3"><rect width="360" height="300" fill="#E8E4FF" class="flash"/></g><path d="M232 92 L222 116 L232 116 L224 138" stroke="#FFE59A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" class="flash"/>';
  }
  const desc=`Сад уровня ${lv}: ${eve?'закат':WEATHER.find(x=>x.id===w).label.toLowerCase()}, питомцев ${pets.length}, теней рядом ${lurk.length}`;
  return `<svg viewBox="0 0 360 300" role="img" aria-label="${esc(desc)}">${s}</svg>`;
}
function encounterSVG(sh){
  const sc=.55+sh.strength/100*.75, glow=1+enc.step*.25+(enc.phase!=='ask'?.2:0);
  const hit=enc.phase==='reply'&&!enc.weak?'hit':'';
  return `<svg viewBox="0 0 360 290" role="img" aria-label="Тень «${esc(sh.name)}», сила ${sh.strength} процентов, напротив неё герой с фонарём">
  <rect width="360" height="290" fill="url(#gEnc)"/>
  <ellipse cx="180" cy="282" rx="200" ry="28" fill="#221E3C"/>
  <g opacity="${(.55+sh.strength*.0045).toFixed(2)}">${place(shadowArt(sh),228,270,sc,hit)}</g>
  ${place(heroArt(glow),64,284,.48,'',160,192)}
  <g fill="#fff" opacity=".06"><rect x="0" y="200" width="360" height="12" rx="6"/><rect x="40" y="250" width="320" height="10" rx="5"/></g>
  </svg>`;
}

/* ---------- Views ---------- */
const ORB='<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFC65C" opacity=".28"/><circle cx="12" cy="12" r="6" fill="#FFC65C"/></svg>';
const CHECK=c=>`<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>`;
const strengthColor=v=>v>60?'var(--danger)':v>30?'var(--warn)':'var(--mint)';
const strengthBar=v=>`<div class="strength"><div class="bar" role="img" aria-label="Сила тени ${v} процентов"><i style="width:${v}%;background:${strengthColor(v)}"></i></div><span>${v}%</span></div>`;
const meetBtn=(sh,cls='btn')=>canMeet(sh)?`<button class="${cls}" data-action="meet" data-arg="${sh.id}">Встретить</button>`:`<button class="${cls} ghost" disabled title="С каждой тенью можно встретиться раз в день">Завтра</button>`;
const wIcon=id=>`<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${WICON[id]}</svg>`;

function dayStatus(){
  return [
    ['Погода',!!state.weather],
    ['Встреча',Object.values(state.met).includes(state.day)],
    ['Дело',Object.keys(state.tasksDone).length>0],
    ['Фонари',state.evening]
  ];
}

function header(){
  const lv=level(state.light), p=(state.light%10)*10;
  const wl=state.weather?WEATHER.find(w=>w.id===state.weather).label.toLowerCase():'погода не выбрана';
  const ds=dayStatus();
  return `<header class="top">
    <div><p class="eyebrow">День ${state.day} · ${state.evening?'вечер':wl}</p><h1>Привет!</h1></div>
    <div class="top-right"><span class="chip" id="lightchip" aria-label="Света: ${state.light}">${ORB}${state.light}</span>
    <button class="icon-btn" data-action="open-help" aria-label="Как играть"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="17" r=".7" fill="currentColor"/></svg></button>
    <button class="icon-btn" data-action="open-settings" aria-label="Настройки"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button></div>
  </header>
  <div class="lvl"><span>Сад · ур. ${lv}</span><div class="bar" role="img" aria-label="До следующего уровня ${10-state.light%10} света"><i style="width:${p}%"></i></div><span>${state.light%10}/10</span></div>
  <div class="daybar" aria-label="Сегодня сделано ${ds.filter(d=>d[1]).length} из 4">${ds.map(([l,ok])=>`<span class="${ok?'ok':''}">${ok?'✓ ':''}${l}</span>`).join('')}</div>`;
}

function weatherCard(){
  const w=state.weather&&WEATHER.find(x=>x.id===state.weather);
  if(w&&!weatherOpen) return `<section class="card wcompact" aria-label="Погода внутри">
    <div class="row"><span class="wicon">${wIcon(w.id)}</span><div class="grow"><span class="name">Погода внутри: ${w.label.toLowerCase()}</span><span class="muted">${w.line}</span></div>
    <button class="btn ghost" data-action="weather-open">Изменить</button></div></section>`;
  return `<section class="card" aria-labelledby="wh">
    <div class="card-head"><h2 id="wh">Какая погода внутри?</h2>${state.weatherBonus?'':'<span class="muted">+1 свет</span>'}</div>
    <p class="muted">Отметь, как ты сейчас. Любая погода нормальна: это просто честный взгляд на себя. Каждое утро погода выбирается заново.</p>
    <div class="weather">${WEATHER.map(x=>`<button class="wbtn" data-action="weather" data-arg="${x.id}" aria-pressed="${state.weather===x.id}">${wIcon(x.id)}${x.label}</button>`).join('')}</div>
  </section>`;
}
function gardenBlock(){
  return `<div class="garden">${gardenSVG()}<span class="gchip tl">Питомцев: ${state.shadows.filter(s=>s.tamed).length}</span><span class="gchip br">Фонарей: ${state.lanterns}</span></div>
  <p class="muted" style="margin-top:-6px;text-align:center">Свет растит сад навсегда. Погода, смелые дела и вечерние фонари обновляются каждый день.</p>`;
}
function shadowsCard(){
  const untamed=state.shadows.filter(s=>!s.tamed);
  if(!state.shadows.length) return `<section class="card" aria-labelledby="th"><h2 id="th" style="font-size:18px;color:#fff">Теней пока нет</h2>
    <p class="muted">Тень — это тревога или страх, сказанные словами. Назови то, что тебя беспокоит, и тень появится у края сада.</p>
    <button class="btn" data-action="open-create">Создать первую тень</button></section>`;
  return `<section class="card" aria-labelledby="th">
    <div class="card-head"><h2 id="th">Тени рядом</h2><span class="muted">${untamed.length}</span></div>
    <p class="muted">Тень — это тревога или страх, сказанные словами. С каждой тенью можно встретиться один раз в день.</p>
    ${untamed.length?untamed.map(sh=>`<div class="row"><div class="mini">${mini(sh,false)}</div><div class="grow"><span class="name">${esc(sh.name)}</span>${strengthBar(sh.strength)}</div>${meetBtn(sh)}</div>`).join(''):'<p class="muted">Все тени приручены. Если что-то снова тревожит, создай новую тень в разделе «Тени».</p>'}
  </section>`;
}
function taskCard(){
  const next=todayTasks().find(t=>!state.tasksDone[t.id]);
  if(!next) return `<section class="card"><p class="label">Смелые дела</p><p class="muted">На сегодня всё сделано. Тени это заметили.</p></section>`;
  return `<section class="task-card" aria-label="Смелое дело дня">
    <div class="badge">${CHECK('#7A4E0E')}</div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><p class="label">Смелое дело дня</p><p class="t">${next.text}</p></div>
    <button class="btn" data-action="task" data-arg="${next.id}">Сделал</button></section>`;
}
function eveningCard(){
  const now=partOfDay()==='evening';
  return `<section class="card${now&&!state.evening?' glow':''}">
    <p class="label">Вечер</p>
    ${state.evening?`<p class="lit"><span class="dot" aria-hidden="true"></span>Фонари сегодня зажжены. Сад на закате.</p>`
      :`<p style="font-weight:700">${now?'Вечер наступил. Запиши три хорошие вещи за день и зажги фонари в саду.':'Вечером запиши три хорошие вещи за день и зажги фонари в саду.'}</p><button class="btn ${now?'':'ghost'}" data-action="nav" data-arg="journal">Открыть дневник</button>`}
  </section>`;
}
function gardenScreen(){
  const W=weatherCard(),G=gardenBlock(),S=shadowsCard(),T=taskCard(),E=eveningCard(),part=partOfDay();
  let order;
  if(!state.weather||weatherOpen) order=[W,G,S,T,E];
  else if(part==='evening'&&!state.evening) order=[E,G,S,T,W];
  else if(part==='day') order=[T,G,S,E,W];
  else order=[G,S,T,E,W];
  return order.join('');
}

function shadowsScreen(){
  return `<div class="section-title"><h2>Тени и питомцы</h2><span class="muted">${state.shadows.filter(s=>s.tamed).length} из ${state.shadows.length} приручено</span></div>
  <p class="muted">Тень — это твоя тревога или страх, высказанные словами. Пока у страха нет имени, он кажется огромным. Честные ответы и смелые дела делают тень меньше, пока она не станет питомцем. Встречаться с тенью можно раз в день.</p>
  <div class="sgrid">
  ${state.shadows.map(sh=>sh.tamed?`<div class="scard">${mini(sh,true)}<span class="name">«${esc(sh.pet)}»</span><span class="tag">Был тенью «${esc(sh.name)}»</span><button class="linkbtn" data-action="open-edit" data-arg="${sh.id}">Изменить</button></div>`
    :`<div class="scard">${mini(sh,false)}<span class="name">${esc(sh.name)}</span>${strengthBar(sh.strength)}${meetBtn(sh)}<button class="linkbtn" data-action="open-edit" data-arg="${sh.id}">Изменить</button></div>`).join('')}
  <button class="add" data-action="open-create"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Создать тень</button>
  </div>`;
}

function tasksScreen(){
  const list=todayTasks(), done=list.filter(t=>state.tasksDone[t.id]).length;
  return `<div class="section-title"><h2>Смелые дела</h2><span class="muted">${done} из ${list.length}</span></div>
  <p class="muted">Маленькие реальные действия на сегодня. Каждое даёт свет, а дело тени ослабляет её на 20%. Завтра будет новый список.</p>
  ${list.map(t=>{const sh=t.shadow&&getSh(t.shadow);const d=!!state.tasksDone[t.id];
    const rw=`+${t.light} света`+(sh?` · тень «${esc(sh.name)}» −20%`:'');
    return `<button class="task${d?' done':''}" data-action="task" data-arg="${t.id}" aria-pressed="${d}"><span class="check">${d?CHECK('#2A1F0E'):''}</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="tt">${t.text}</span><span class="rw">${d?'Сделано':rw}</span></span></button>`}).join('')}`;
}

function journalScreen(){
  const today=state.journal.find(j=>j.day===state.day);
  return `<div class="section-title"><h2>Три хорошие вещи</h2><span class="muted">День ${state.day}</span></div>
  ${today?`<section class="card"><p class="label">Сегодня</p><ul style="margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:10px">${today.items.map(i=>`<li class="lit"><span class="dot" aria-hidden="true"></span>${esc(i)}</li>`).join('')}</ul><p class="muted">Фонари зажжены. Завтра будет новая запись.</p></section>`
  :`<form class="card" data-form="journal" novalidate>
    <p style="font-weight:700">Что сегодня было в порядке? Даже мелочь считается.</p>
    ${[1,2,3].map(n=>`<div class="field"><label for="j${n}">Хорошая вещь ${n}</label><input id="j${n}" autocomplete="off" maxlength="80" placeholder="${['Например: выспался','Например: вкусно поел','Например: закрыл задачу'][n-1]}"></div>`).join('')}
    <p class="err" id="jerr" role="alert"></p>
    <button class="btn big" type="submit">Зажечь фонари · +3 света</button>
  </form>`}
  <section class="card"><p class="label">Прошлые записи</p>
    ${state.journal.filter(j=>j.day!==state.day).map(j=>`<div class="entry"><span class="muted">${j.example?'Пример':'День '+j.day}</span><ul>${j.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')||'<p class="muted">Пока пусто.</p>'}
  </section>`;
}

function nav(){
  const items=[['garden','Сад','<path d="M12 21v-8"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7Z"/><path d="M12 13c4 0 6-3 6-7-4 0-6 3-6 7Z"/><path d="M5 21h14"/>'],
    ['shadows','Тени','<path d="M5 20V11a7 7 0 0 1 14 0v9l-2.3-1.5L14.3 20 12 18.5 9.7 20l-2.4-1.5Z"/><circle cx="9.5" cy="11" r="1"/><circle cx="14.5" cy="11" r="1"/>'],
    ['tasks','Дела','<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'],
    ['journal','Дневник','<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>']];
  return `<nav class="nav" aria-label="Разделы">${items.map(([id,l,ic])=>`<button data-action="nav" data-arg="${id}" ${state.screen===id?'aria-current="page"':''}><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>${l}</button>`).join('')}</nav>`;
}

function encounterView(){
  const sh=getSh(enc.id), st=steps(sh), cur=st[Math.min(enc.step,2)];
  const bubble=enc.phase==='reply'?enc.reply:(enc.step===0?sh.line:enc.reply);
  let body='';
  if(enc.phase==='ask'){
    body=`<h2 id="eq">${cur.q}</h2>
    ${cur.o.map((o,i)=>`<button class="opt" data-action="answer" data-arg="${i}">${o[0]}</button>`).join('')}
    <form class="own" data-form="own"><label for="ownin" style="position:absolute;left:-9999px">Свой ответ</label><input id="ownin" autocomplete="off" maxlength="100" placeholder="Или ответь своими словами"><button class="btn" type="submit">Ответить</button></form>`;
  } else if(enc.phase==='reply'){
    body=`<div class="delta"><span style="color:${enc.weak?'var(--danger)':'var(--mint)'}">Тень −${enc.delta}%</span>${enc.weak?'':'<span style="color:var(--lamp-soft)">+1 свет</span>'}</div>
    ${enc.weak?'<p class="hint">Это ответ самой тени, поэтому он почти её не ослабил. Попробуй опираться на факты: что у тебя уже есть и что ты можешь сделать.</p>':''}
    <button class="btn big" data-action="next">${sh.strength<=0?'Тень тает…':enc.step<2?'Следующий вопрос':'Завершить встречу'}</button>`;
  } else {
    body=`<h2>Тень ослабла до ${sh.strength}%</h2><p class="muted">Следующая встреча с ней будет завтра. А смелые дела в разделе «Дела» можно сделать уже сегодня, они тоже ослабляют тень.</p>
    <div style="display:flex;gap:8px"><button class="btn" style="flex:1" data-action="nav" data-arg="tasks">К делам</button><button class="btn ghost" style="flex:1" data-action="close-enc">В сад</button></div>`;
  }
  return `<section class="overlay" role="dialog" aria-modal="true" aria-label="Встреча с тенью «${esc(sh.name)}»">
    <div class="enc-top"><button class="icon-btn" data-action="close-enc" aria-label="Уйти в сад"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><p>Встреча с тенью</p><span class="pill">${enc.phase==='end'?'Итог':`Вопрос ${enc.step+1} из 3`}</span></div>
    <div class="enc-scene">${encounterSVG(sh)}<div class="bubble">${esc(bubble)}</div></div>
    <div class="enc-meter"><div class="card-head"><span class="name" style="font-weight:800">${esc(sh.name)}</span><span style="font-weight:800;font-size:14px;color:${strengthColor(sh.strength)}">сила ${sh.strength}%</span></div><div class="bar"><i style="width:${sh.strength}%;background:${strengthColor(sh.strength)}"></i></div></div>
    <div class="enc-card">${body}</div>
  </section>`;
}

function sheetView(){
  const wrap=inner=>`<div class="sheet-wrap" data-action="close-sheet-bg">${inner}</div>`;
  if(sheet.type==='settings') return wrap(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh1">
    <h2 id="sh1">Настройки</h2>
    <button class="btn big ghost" data-action="toggle-sound" aria-pressed="${state.sound}">Звук и вибрация: ${state.sound?'включены':'выключены'}</button>
    <div class="group"><p class="label">Игра на экране телефона</p>
      ${installEvt?'<button class="btn big" data-action="install">Установить как приложение</button>'
      :'<p class="muted">Открой меню браузера и выбери «На экран „Домой“» или «Установить приложение». Игра откроется на весь экран, как обычное приложение.</p>'}</div>
    <div class="group"><p class="label">Перенос прогресса</p>
      <p class="muted">Прогресс хранится в этом браузере. Скопируй код и вставь его на другом телефоне, чтобы продолжить там.</p>
      <button class="btn ghost" data-action="export-code">Скопировать код прогресса</button>
      ${sheet.code?`<label for="ecode" class="muted">Твой код</label><textarea id="ecode" class="code" readonly>${sheet.code}</textarea>`:''}
      <form data-form="import" class="group" novalidate><label for="icode" class="muted">Вставь код с другого устройства</label><textarea id="icode" class="code" placeholder="Код прогресса"></textarea><p class="err" id="ierr" role="alert"></p><button class="btn ghost" type="submit">Восстановить прогресс</button></form>
    </div>
    <div class="group"><p class="label">Для проверки</p>
      <button class="btn ghost" data-action="new-day">Начать новый день сейчас</button>
      <button class="btn ghost" data-action="reset" style="${resetArmed?'border-color:var(--danger);color:var(--danger)':''}">${resetArmed?'Нажми ещё раз, чтобы стереть всё':'Сбросить прогресс'}</button></div>
    <button class="btn big" data-action="close-sheet">Закрыть</button></div>`);
  if(sheet.type==='edit'){
    const sh=getSh(sheet.id);
    return wrap(`<form class="sheet" data-form="edit" role="dialog" aria-modal="true" aria-labelledby="sh3" novalidate>
      <h2 id="sh3">${sh.tamed?'Питомец':'Тень'} «${esc(sh.tamed?sh.pet:sh.name)}»</h2>
      <div class="field"><label for="ename">Имя тени</label><input id="ename" maxlength="28" autocomplete="off" value="${esc(sh.name)}"></div>
      ${sh.tamed?`<div class="field"><label for="epet">Имя питомца</label><input id="epet" maxlength="28" autocomplete="off" value="${esc(sh.pet)}"></div>`:''}
      <p class="err" id="eerr" role="alert"></p>
      <button class="btn big" type="submit">Сохранить</button>
      <button class="btn ghost" type="button" data-action="delete-shadow" style="${sheet.armed?'border-color:var(--danger);color:var(--danger)':''}">${sheet.armed?'Нажми ещё раз, чтобы удалить':'Удалить'}</button>
      <button class="btn ghost" type="button" data-action="close-sheet">Отмена</button>
    </form>`);
  }
  return wrap(`<form class="sheet" data-form="create" role="dialog" aria-modal="true" aria-labelledby="sh2" novalidate>
    <h2 id="sh2">${sheet.first?'Твоя первая тень':'Новая тень'}</h2>
    <p class="muted">Что тебя тревожит? Назови это так, как оно звучит у тебя в голове: «Не справлюсь», «Меня осудят», «Опоздаю». Можно с юмором.</p>
    <div class="field"><label for="cname">Имя тени</label><input id="cname" maxlength="28" autocomplete="off" placeholder="Например: Страх выступлений"></div>
    <p class="label">Как она выглядит</p>
    <div class="looks">${Object.entries(LOOKS).map(([k,l])=>`<button type="button" class="look" data-action="look" data-arg="${k}" aria-pressed="${sheet.look===k}">${mini({kind:'custom',look:k},false)}${l.label}</button>`).join('')}</div>
    <p class="err" id="cerr" role="alert"></p>
    <button class="btn big" type="submit">Создать тень</button>
    <p class="label" style="margin-top:4px">Или возьми готовую</p>
    <div class="presets">${Object.entries(PRESETS).map(([k,p])=>{const has=state.shadows.some(s=>s.kind===k);
      return `<button type="button" class="preset" data-action="preset" data-arg="${k}" ${has?'disabled':''}>${mini({kind:k},false)}<span><b>${p.name}</b><small>${has?'Уже есть':p.hint}</small></span></button>`}).join('')}</div>
    <button class="btn ghost" type="button" data-action="close-sheet">${sheet.first?'Позже':'Отмена'}</button>
  </form>`);
}

function tameView(){
  const sh=getSh(tameShow);
  return `<section class="tame" role="dialog" aria-modal="true" aria-labelledby="tm">
    <div class="stage">
      <svg viewBox="-5 -14 150 164" class="t-shadow" aria-hidden="true">${shadowArt(sh)}</svg>
      <svg viewBox="-5 -14 150 164" class="t-pet" role="img" aria-label="Питомец «${esc(sh.pet)}»">${petArt(sh)}</svg>
      <svg viewBox="0 0 220 230" class="t-spark" aria-hidden="true">${SPARK(30,40,10,'#FFE0A3')}${SPARK(190,60,8,'#8EE3C1')}${SPARK(200,170,11,'#FFC65C')}${SPARK(24,180,7,'#B9A4FF')}${SPARK(110,8,6,'#FFE0A3')}</svg>
    </div>
    <h2 id="tm">Тень приручена!</h2>
    <p>«${esc(sh.name)}» теперь твой питомец «${esc(sh.pet)}». Он поселился в саду. Имя питомцу можно поменять в разделе «Тени».</p>
    <p class="reward">+5 света</p>
    <button class="btn big" style="max-width:300px" data-action="close-tame">В сад</button>
  </section>`;
}

const INTRO=[
  {art:'shadow',title:'Тени — это твои тревоги',text:'Каждая тень — это страх или тревожная мысль, сказанная словами: «меня уволят», «денег не хватит», «я бездельничаю». Пока у страха нет имени, он кажется огромным. Когда имя есть, с ним можно поговорить.'},
  {art:'meet',title:'Встреча с тенью',text:'Раз в день тень задаёт тебе трудные вопросы, а ты отвечаешь честно и с опорой на факты. Каждый такой ответ делает её слабее. Ответы вроде «всё пропало» — это голос самой тени, они почти не помогают.'},
  {art:'pet',title:'Из тени — в питомца',text:'Встречи и смелые дела за несколько дней ослабляют тень до нуля. Тогда она становится питомцем и поселяется в твоём саду. Страх не исчезает, а начинает помогать.'},
  {art:'garden',title:'Сад, свет и новый день',text:'За честные ответы, смелые дела и хорошие вещи дня ты получаешь свет. Свет растит сад навсегда. А каждый новый день начинается заново: утром выбираешь погоду, днём ждут смелые дела, вечером зажигаешь фонари.',note:'«Тени» помогают тренировать привычку спокойно смотреть на тревогу, но не заменяют помощь специалиста, если тебе очень тяжело.'}
];
function introView(){
  const s=INTRO[intro], last=intro===INTRO.length-1, demo={kind:'fired'};
  const box=inner=>`<svg viewBox="-5 -14 150 164" aria-hidden="true">${inner}</svg>`;
  const arrow='<svg viewBox="0 0 34 20" aria-hidden="true" style="height:22px;width:34px;flex-shrink:0"><path d="M2 10 L28 10 M20 3 L30 10 L20 17" stroke="#FFC65C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const art={
    shadow:box(shadowArt(demo)),
    meet:`<svg viewBox="0 0 160 192" aria-hidden="true" style="height:70%">${heroArt(1.2)}</svg>${box(shadowArt(demo))}`,
    pet:`<div style="height:65%;display:flex;align-items:center">${box(shadowArt(demo))}</div>${arrow}<div style="height:65%;display:flex;align-items:center">${box(petArt(demo))}</div>`,
    garden:`<div class="garden-mini">${gardenSVG()}</div>`
  }[s.art];
  const lastLabel=!state.shadows.length?'Создать первую тень':(state.seenIntro?'Понятно':'Начать');
  return `<section class="intro" role="dialog" aria-modal="true" aria-labelledby="ih">
    <button class="skip" data-action="intro-skip">${state.seenIntro?'Закрыть':'Пропустить'}</button>
    <div class="intro-art">${art}</div>
    <div class="dots" aria-label="Шаг ${intro+1} из ${INTRO.length}">${INTRO.map((_,i)=>`<span class="${i===intro?'on':''}"></span>`).join('')}</div>
    <h2 id="ih">${s.title}</h2>
    <p>${s.text}</p>${s.note?`<p class="note">${s.note}</p>`:''}
    <div class="intro-nav">${intro>0?'<button class="btn ghost" data-action="intro-prev">Назад</button>':''}<button class="btn" data-action="${last?'intro-done':'intro-next'}">${last?lastLabel:'Дальше'}</button></div>
  </section>`;
}

function screenBody(){return {garden:gardenScreen,shadows:shadowsScreen,tasks:tasksScreen,journal:journalScreen}[state.screen]()}

function render(keepScroll=true){
  const old=document.getElementById('screen'), top=old&&keepScroll?old.scrollTop:0;
  document.getElementById('view').innerHTML=header()+`<main class="screen" id="screen">${screenBody()}</main>`+nav()+(enc?encounterView():'')+(sheet?sheetView():'')+(tameShow?tameView():'')+(intro!==null?introView():'');
  const scr=document.getElementById('screen'); if(scr) scr.scrollTop=top;
  if(focusNext){const el=document.querySelector(focusNext); if(el) el.focus({preventScroll:true}); focusNext=null}
  if(pendingFly) requestAnimationFrame(flyLight);
}

/* ---------- Mechanics ---------- */
function tame(sh){sh.tamed=true;sh.strength=0;gain(5);setTimeout(()=>sfx('tame'),900);buzz([20,40,90]);tameShow=sh.id;focusNext='.tame .btn'}
function hurt(sh,d){sh.strength=Math.max(0,sh.strength-d)}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function newDay(){state.day++;state.weather=null;state.weatherBonus=false;state.evening=false;state.tasksDone={};weatherOpen=false}
function checkDay(){const t=todayStr();if(!state.lastDate){state.lastDate=t;save();return false}
  if(state.lastDate!==t){newDay();state.lastDate=t;save();return true}return false}
function checkDayComplete(){
  if(state.dayBonus!==state.day&&dayStatus().every(d=>d[1])){state.dayBonus=state.day;gain(2);toast('Весь день пройден: +2 света')}
}
function commit(keepScroll=true){checkDayComplete();save();render(keepScroll)}
const encodeState=()=>btoa(unescape(encodeURIComponent(JSON.stringify(state))));
const decodeState=c=>JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
function openFirstShadow(){if(!state.shadows.length){sheet={type:'create',look:'fog',first:true};focusNext='#cname'}}

const actions={
  nav(id){state.screen=id;enc=null;save();render(false)},
  weather(id){state.weather=id;weatherOpen=false;if(!state.weatherBonus){state.weatherBonus=true;addLight(1,'+1 свет за честность с собой')}commit()},
  'weather-open'(){weatherOpen=true;render()},
  meet(id){const sh=getSh(id);if(!sh||!canMeet(sh))return;enc={id,step:0,phase:'ask',reply:'',delta:0,weak:false};focusNext='.overlay .icon-btn';render()},
  answer(i){const sh=getSh(enc.id),o=steps(sh)[enc.step].o[+i];respond(sh,Math.max(1,Math.round(o[1]*ANSWER_FACTOR)),o[2],o[1]<10)},
  next(){const sh=getSh(enc.id);
    if(sh.strength<=0){enc=null;tame(sh)}
    else if(enc.step<2){enc.step++;enc.phase='ask';focusNext='#eq'}
    else enc.phase='end';
    commit()},
  'close-enc'(){enc=null;render()},
  task(id){if(state.tasksDone[id])return;const t=todayTasks().find(x=>x.id===id);if(!t)return;state.tasksDone[id]=true;
    const sh=t.shadow&&getSh(t.shadow);addLight(t.light);buzz(15);
    if(sh&&!sh.tamed){hurt(sh,20);if(sh.strength<=0)tame(sh)}
    commit()},
  'open-settings'(){sheet={type:'settings'};resetArmed=false;focusNext='.sheet .btn';render()},
  'open-create'(){sheet={type:'create',look:'fog'};focusNext='#cname';render()},
  'open-edit'(id){sheet={type:'edit',id,armed:false};focusNext='#ename';render()},
  look(k){sheet.look=k;document.querySelectorAll('.look').forEach(x=>x.setAttribute('aria-pressed',x.dataset.arg===k))},
  preset(k){if(state.shadows.some(s=>s.kind===k))return;state.shadows.push(makeShadow(k));sheet=null;sfx('tap');save();render();toast('Тень появилась у края сада')},
  'delete-shadow'(){if(!sheet.armed){sheet.armed=true;const b=document.querySelector('[data-action="delete-shadow"]');if(b){b.textContent='Нажми ещё раз, чтобы удалить';b.style.borderColor='var(--danger)';b.style.color='var(--danger)'}return}
    state.shadows=state.shadows.filter(s=>s.id!==sheet.id);delete state.met[sheet.id];sheet=null;save();render();toast('Удалено')},
  'close-sheet'(){sheet=null;render()},
  'close-sheet-bg'(a,b,e){if(e.target===b){sheet=null;render()}},
  'toggle-sound'(){state.sound=!state.sound;save();render();if(state.sound)sfx('tap')},
  install(){if(!installEvt)return;installEvt.prompt();installEvt=null;render()},
  'export-code'(){const code=encodeState();
    try{navigator.clipboard.writeText(code).then(()=>toast('Код скопирован'),()=>toast('Скопируй код из поля ниже'))}catch(e){toast('Скопируй код из поля ниже')}
    sheet.code=code;render();const ta=document.getElementById('ecode');if(ta){ta.focus();ta.select()}},
  'new-day'(){newDay();sheet=null;state.screen='garden';save();render(false);toast(`Утро. День ${state.day}`)},
  reset(){if(!resetArmed){resetArmed=true;render();return}state=fresh();state.lastDate=todayStr();sheet=null;enc=null;tameShow=null;resetArmed=false;intro=0;save();render(false);toast('Прогресс сброшен')},
  'close-tame'(){tameShow=null;state.screen='garden';render(false)},
  'open-help'(){intro=0;focusNext='.intro .intro-nav .btn';render()},
  'intro-next'(){intro++;focusNext='.intro .intro-nav .btn:last-child';render()},
  'intro-prev'(){intro--;focusNext='.intro .intro-nav .btn:last-child';render()},
  'intro-skip'(){intro=null;state.seenIntro=true;openFirstShadow();save();render()},
  'intro-done'(){intro=null;state.seenIntro=true;openFirstShadow();save();render()}
};
function respond(sh,d,r,weak){hurt(sh,d);enc.phase='reply';enc.reply=r;enc.delta=d;enc.weak=weak;state.met[sh.id]=state.day;
  if(!weak)gain(1);else sfx('tap');focusNext='.enc-card .btn';commit()}

const forms={
  own(f){const v=f.querySelector('#ownin').value.trim();if(v.length<3){f.querySelector('#ownin').focus();return}
    respond(getSh(enc.id),Math.round(25*ANSWER_FACTOR),'Своими словами? Это сильнее всего… Я тускнею.',false)},
  journal(f){const vals=[1,2,3].map(n=>f.querySelector('#j'+n).value.trim());const empty=vals.findIndex(v=>!v);
    if(empty>-1){f.querySelector('#jerr').textContent='Заполни все три строки, даже мелочь считается.';f.querySelector('#j'+(empty+1)).focus();return}
    state.journal.unshift({day:state.day,items:vals});state.evening=true;state.lanterns++;
    addLight(3,'Фонари зажжены: +3 света');commit()},
  create(f){const name=f.querySelector('#cname').value.trim();if(!name){f.querySelector('#cerr').textContent='Дай тени имя, чтобы с ней можно было говорить.';f.querySelector('#cname').focus();return}
    state.shadows.push(makeShadow('custom',name,sheet.look));sfx('tap');
    sheet=null;save();render();toast('Тень появилась у края сада')},
  edit(f){const sh=getSh(sheet.id),name=f.querySelector('#ename').value.trim(),pet=f.querySelector('#epet');
    if(!name||(pet&&!pet.value.trim())){f.querySelector('#eerr').textContent='Имя не может быть пустым.';return}
    sh.name=name;if(!PRESETS[sh.kind]||sh.kind==='custom')sh.line=`Я — твоя тень «${name}». Ты со мной не справишься!`;if(pet)sh.pet=pet.value.trim();
    sheet=null;save();render();toast('Сохранено')},
  import(f){const v=f.querySelector('#icode').value;
    try{const s=decodeState(v);if(!s||s.v!==1||!Array.isArray(s.shadows))throw 0;
      state=upgrade(s);checkDay();sheet=null;save();render(false);toast('Прогресс восстановлен')}
    catch(e){f.querySelector('#ierr').textContent='Код не подошёл. Скопируй его целиком и попробуй ещё раз.'}}
};

const root=document.getElementById('app');
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!root.contains(b))return;
  const r=b.getBoundingClientRect();lastPt={x:r.left+r.width/2,y:r.top+r.height/2};
  const fn=actions[b.dataset.action];if(fn)fn(b.dataset.arg,b,e)});
root.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const s=e.submitter||f.querySelector('[type=submit]');if(s){const r=s.getBoundingClientRect();lastPt={x:r.left+r.width/2,y:r.top+r.height/2}}
  forms[f.dataset.form]?.(f)});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(intro!==null)actions['intro-skip']();else if(tameShow)actions['close-tame']();else if(sheet)actions['close-sheet']();else if(enc)actions['close-enc']()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(sheet&&sheet.type==='settings')render()});

const NEWDAY_MSG='Новый день: погода, дела и фонари обновились';
function boot(data){
  state=(data&&data.state&&data.state.v===1)?upgrade(data.state):load();
  const changed=checkDay();
  if(!state.seenIntro){intro=0;focusNext='.intro .intro-nav .btn'}
  render(false);
  if(changed)toast(NEWDAY_MSG);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&checkDay()){enc=null;render(false);toast(NEWDAY_MSG)}});
if(window.claude?.hot?.snapshot) window.claude.hot.snapshot(()=>({state}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
</html>
